name: Vol Monitor 30min

on:
  schedule:
    # 30분 주기 (2026-06-12 변경) — 미국 RTH 09:30-16:00 ET = UTC 13:30-20:00 / KST 22:30-05:00
    # 모든 시간 트리거. kinetic 은 RTH 가드 있어 휴장 시 no-op.
    # ⚠ GH Actions cron 은 5-15분 지터 가능 — 정확한 시각 보장 안 됨.
    - cron: "*/30 * * * *"
  workflow_dispatch:   # 수동 트리거 가능

# 외부 핑거(:00/:30 격자)와 GH 자체 cron 이 겹쳐 발화하면 런 2개가 병렬로 돌고,
# 뒤쪽 런의 push 가 거부되어 그 사이클의 누적 데이터(trade_journal 포함)가 통째로
# 버려진다 — 장중이면 저널-라이브 정합 붕괴로 직결 (2026-10-21 실측).
# 직렬화로 근본 차단. 대기 중 런이 또 밀리면 오래된 pending 이 취소되는데,
# 사이클은 멱등 재생성이라 중복 1건 취소는 무해하다.
concurrency:
  group: vol-monitor
  cancel-in-progress: false

permissions:
  contents: write      # 누적 데이터 (trade_journal, iv_history) commit/push
  actions:  read       # Stage 0 외부 핑거 생존 점검 (gh run list)

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          # ⚠ 기본값(github.sha)은 런이 *생성된* 시점의 SHA 로 고정된다. concurrency
          #    대기열에 묶였던 런은 앞 런이 push 한 데이터를 못 본 채 옛 tip 위에
          #    커밋 → push 거부 → rebase 충돌. ref: main 으로 체크아웃 시점의
          #    브랜치 tip 을 받아 base 를 항상 최신으로 (2026-10-21 회귀테스트 실측).
          ref: main

      # 외부 핑거(cron-job.org → workflow_dispatch)가 조용히 죽으면 RTH cadence 가
      # 시간당 2~3회 → 하루 1회로 붕괴하는데 워크플로는 계속 success 로 보인다.
      # 실제로 PAT 만료 탓에 2026-09-11 ~ 10-21 (39일) 동안 들키지 않았다.
      - name: Stage 0 — 외부 핑거 생존 점검 (non-blocking)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vol_monitor.yml --event workflow_dispatch --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "::warning::workflow_dispatch 이력 없음 — 외부 핑거 미설정 의심"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "마지막 외부 핑거 dispatch = $last (${age}일 전)"
          echo "- 외부 핑거 마지막 dispatch: \`$last\` (${age}일 전)" >> "$GITHUB_STEP_SUMMARY"
          # 금 20:30Z → 월 13:00Z = 2.7일 이므로 주말 오탐 방지 임계 = 3일
          if [ "$age" -ge 3 ]; then
            echo "::error::외부 핑거(cron-job.org)가 ${age}일째 침묵 — PAT 만료 의심. RTH cadence 붕괴 위험."
            echo "- ⚠ **외부 핑거 ${age}일째 침묵 — PAT 확인 필요**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # macro_research 전용 의존성 (nasdaqdatalink 등) — 누락 시 Stage 2 가
          # ModuleNotFoundError 로 조용히 죽어 캐시 갱신이 전부 스킵됐었음 (2026-06-12)
          pip install -r macro_research/requirements.txt

      - name: Stage 1 — Vol monitor pipeline (yfinance + EIA + FRED)
        env:
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python vol_monitor_pipeline.py
        continue-on-error: false

      - name: Stage 2 — Refresh analytical caches (data_loader + GARCH + IV + partial 회귀)
        env:
          NASDAQ_DATA_LINK_KEY: ${{ secrets.NASDAQ_DATA_LINK_KEY }}
        working-directory: ./macro_research
        run: |
          # 원시 레벨 = LKG(lkg_levels.csv, Stage 5 커밋) 기준 거래일 고정 — 새 거래일이
          # 붙을 때만 갱신, 장중엔 결측 칸 보강만. yfinance 간헐 누락이 사이클마다 회귀
          # 입력을 바꿔 신호가 깜빡이던 것 차단 (2026-10-21). 결과는 data_quality.json.
          python data_loader.py
          python garch_estimator.py
          python implied_vol.py
          # 다변량 partial 회귀 (rate_* 룰의 delta_ctrl/FDR 입력) — 빠름 (~10s)
          python regression_engine.py
        continue-on-error: true

      # ⚠ 타이밍 민감 청산(시그널 사망·손절 등)은 cron 지터(위 5-15분)로 최대
      #    수십 분 늦을 수 있다. 즉시 청산이 필요하면 Actions 탭에서
      #    workflow_dispatch 로 수동 트리거(장중 한정 — kinetic RTH 가드 적용).
      # ⚠ ALPACA_ENDPOINT 는 반드시 paper-api.alpaca.markets (페이퍼). kinetic 은
      #    코드 레벨 paper 가드 없이 이 값을 그대로 사용한다(TRADE_BASE). 실자본
      #    전환 시 (1) 엔드포인트 변경 (2) GH Secrets 키 영속 상주 blast-radius
      #    재검토 — pending 의 'real_capital_key_residency' 항목 참조.
      - name: Stage 3 — Kinetic executor (--auto --minimal, RTH-guarded)
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_ENDPOINT:   ${{ secrets.ALPACA_ENDPOINT }}
          RISK_FREE_RATE:    "0.05"
        working-directory: ./macro_research
        run: |
          python kinetic_executor.py --auto --minimal

      - name: Stage 4 — Feedback (per rule|strategy multipliers)
        working-directory: ./macro_research
        run: |
          python feedback.py
        continue-on-error: true

      - name: Stage 5 — Commit accumulated data + cross-run state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 누적 데이터 + 사이클 간 상태 (러너 휘발성 — 커밋 없이는 트레일 피크/
          # 레짐 히스테리시스/시그널은퇴 기준이 매 사이클 리셋됨, 2026-06-12)
          git add macro_research/output/trade_journal.jsonl \
                  macro_research/output/iv_history.jsonl \
                  macro_research/output/flag_log.jsonl \
                  macro_research/output/rule_performance.json \
                  macro_research/output/attribution.json \
                  macro_research/output/trail_state.json \
                  macro_research/output/regime_state.json \
                  macro_research/output/rule_sector_state.json \
                  macro_research/output/partial_results.csv \
                  macro_research/output/static_results.csv \
                  macro_research/output/churn_fills.json \
                  macro_research/output/event_vol_shadow_log.jsonl \
                  macro_research/output/phantom_pending.json \
                  macro_research/output/orphan_positions.json \
                  macro_research/output/lkg_levels.csv \
                  macro_research/output/data_quality.json \
                  macro-portal/public/data/vol_monitor_data.json \
                  macro-portal/public/data/ontology_signals.json \
                  macro-portal/public/data/iv_history.json \
                  macro-portal/public/data/forward_validation.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # ⚠ 기존 `git pull --rebase origin main || true` 는 add 목록 밖 파일의
          #    unstaged 변경 때문에 "cannot pull with rebase" 로 *매번* 실패했다
          #    (성공 사이클에서도). 레이스 복구 네트가 애초에 동작한 적이 없었고,
          #    뒤이은 `git push || echo ...` 가 거부를 삼켜 job 을 success 로
          #    위장했다. 2026-10-21 병렬 런에서 실측 — 커밋 1건 유실.
          #    → --autostash 로 rebase 를 실제 동작시키고, 최종 실패는 job 을 죽인다.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            echo "::warning::push 거부됨 (시도 ${i}/5) — rebase 후 재시도"
            # ⚠ rebase 가 충돌로 멈추면 HEAD 가 upstream 에 detach 된다. 그대로 두면
            #    다음 push 가 "Everything up-to-date" 로 *성공*해 우리 커밋이 조용히
            #    증발한다 — 고치려던 바로 그 실패 클래스. 반드시 abort 로 되돌린다.
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::rebase 충돌 — abort (커밋 보존)"
            fi
            sleep $(( i * 3 ))
          done
          # push 성공 여부를 반환값이 아니라 *불변식*으로 판정한다:
          # "Stage 5 종료 시 origin/main 에 없는 로컬 커밋이 남아 있으면 안 된다".
          # detach/abort/충돌 어느 경로로 빠져도 유실이면 반드시 걸린다.
          git fetch -q origin main
          unpushed=$(git rev-list --count FETCH_HEAD..HEAD)
          if [ "$unpushed" != "0" ]; then
            echo "::error::Stage 5 push 실패 — 미반영 커밋 ${unpushed}건. 이 사이클 누적 데이터(trade_journal 포함) 유실. 저널-라이브 정합 확인 필요."
            exit 1
          fi
          echo "Stage 5 push 확인 — 미반영 커밋 0건"

      - name: Stage 6 — Deploy to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./macro-portal
        run: |
          npm install --global vercel@latest
          # Vercel 클라우드에서 빌드 (Python API routes 의 uv 의존성 회피).
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Pipeline failed — check logs above"
